<!DOCTYPE html>
<html>
<head>
    <title>AI Threat Detection API</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000000; color: #ffffff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        h1 { text-align: center; margin: 20px 0; color: #ffffff; font-size: 2em; }
        .status { text-align: center; padding: 15px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; margin: 20px 0; border: 1px solid rgba(255, 255, 255, 0.1); }
        .status.ok { border-left: 4px solid #4CAF50; color: #4caf50; }
        .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; justify-content: center; }
        
        button { 
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-icon {
            font-size: 1.2em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.4));
        }

        .btn-text {
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-guide {
            background: rgba(156, 39, 176, 0.15);
            border-color: rgba(156, 39, 176, 0.4);
            color: #9c27b0;
        }

        .btn-guide:hover {
            background: rgba(156, 39, 176, 0.25);
            box-shadow: 0 0 20px rgba(156, 39, 176, 0.4);
            transform: translateY(-2px);
        }

        .btn-scan {
            background: rgba(33, 150, 243, 0.15);
            border-color: rgba(33, 150, 243, 0.4);
            color: #2196f3;
        }

        .btn-scan:hover {
            background: rgba(33, 150, 243, 0.25);
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.4);
            transform: translateY(-2px);
        }

        .btn-threat {
            background: rgba(244, 67, 54, 0.15);
            border-color: rgba(244, 67, 54, 0.4);
            color: #f44336;
        }

        .btn-threat:hover {
            background: rgba(244, 67, 54, 0.25);
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.4);
            transform: translateY(-2px);
        }

        .btn-clear {
            background: rgba(158, 158, 158, 0.15);
            border-color: rgba(158, 158, 158, 0.4);
            color: #9e9e9e;
        }

        .btn-clear:hover {
            background: rgba(158, 158, 158, 0.25);
            box-shadow: 0 0 20px rgba(158, 158, 158, 0.4);
            transform: translateY(-2px);
        }

        .results { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .result-box { background: rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 20px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .result-box h3 { margin-bottom: 10px; }
        .result-box pre { background: rgba(0, 0, 0, 0.5); padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 12px; color: #4caf50; }
        .normal { border-left: 4px solid #4CAF50; }
        .malicious { border-left: 4px solid #f44336; }
        .error { border-left: 4px solid #ff9800; }
        @media (max-width: 768px) { .results { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ AI Cybersecurity Threat Detection System</h1>
        
        <div class="status ok">
            <strong>✓ API Status:</strong> Running on http://127.0.0.1:5001
        </div>
        
        <div class="buttons">
            <button onclick="testHealth()" class="btn-guide"><span class="btn-icon">❓</span><span class="btn-text">Health</span></button>
            <button onclick="testInfo()" class="btn-guide"><span class="btn-icon">❓</span><span class="btn-text">Info</span></button>
            <button onclick="analyzeNormal()" class="btn-scan"><span class="btn-icon">🔍</span><span class="btn-text">Scan</span></button>
            <button onclick="analyzeMalicious()" class="btn-threat"><span class="btn-icon">⚡</span><span class="btn-text">Threat</span></button>
            <button onclick="clearResults()" class="btn-clear"><span class="btn-icon">✕</span><span class="btn-text">Clear</span></button>
        </div>
        
        <div class="results" id="results"></div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5001';

        function addResult(title, data, type = 'normal') {
            const results = document.getElementById('results');
            const box = document.createElement('div');
            box.className = `result-box ${type}`;
            box.innerHTML = `
                <h3>${title}</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
            results.appendChild(box);
        }

        function testHealth() {
            fetch(`${API_URL}/api/health`)
                .then(r => r.json())
                .then(d => addResult('Health Check', d, 'normal'))
                .catch(e => addResult('Error', {error: e.message}, 'error'));
        }

        function testInfo() {
            fetch(`${API_URL}/api/info`)
                .then(r => r.json())
                .then(d => addResult('Service Info', d, 'normal'))
                .catch(e => addResult('Error', {error: e.message}, 'error'));
        }

        function analyzeNormal() {
            const data = {
                packet_size: 256.5,
                packet_rate: 10.2,
                protocol_tcp: 1,
                protocol_udp: 0,
                protocol_icmp: 0,
                src_port_common: 1,
                dst_port_common: 1,
                connection_duration: 45.3,
                payload_entropy: 4.2,
                retransmission_rate: 0.01
            };
            fetch(`${API_URL}/api/analyze`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(d => addResult('Normal Traffic Analysis', d, 'normal'))
            .catch(e => addResult('Error', {error: e.message}, 'error'));
        }

        function analyzeMalicious() {
            const data = {
                packet_size: 512.0,
                packet_rate: 95.5,
                protocol_tcp: 1,
                protocol_udp: 1,
                protocol_icmp: 1,
                src_port_common: 0,
                dst_port_common: 0,
                connection_duration: 3.2,
                payload_entropy: 6.8,
                retransmission_rate: 0.35
            };
            fetch(`${API_URL}/api/analyze`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(d => addResult('Malicious Traffic Analysis', d, d.threat_type === 'Malicious' ? 'malicious' : 'normal'))
            .catch(e => addResult('Error', {error: e.message}, 'error'));
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        // Auto-test on load
        window.onload = () => {
            testHealth();
            testInfo();
        };
    </script>
</body>
</html>
